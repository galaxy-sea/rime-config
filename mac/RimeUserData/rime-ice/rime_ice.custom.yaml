# macOS 雾凇拼音个性化补丁，保留官方组件，仅追加自定义功能。
patch:
  # mac 专用：回车上屏的纯英文以注释形式追加到仓库词库，人工确认后启用。
  "engine/processors/@before 0": lua_processor@*english_capture
  "english_capture":
    __include: english_capture:/config

  # 候选权重。
  "translator/initial_quality": 1.2
  "melt_eng/initial_quality": 1.1
  # 回车命中英文词库时写入用户词频，原词库文件保持不变。
  "melt_eng/enable_user_dict": true
  "melt_eng/user_dict": melt_eng
  "melt_eng/db_class": userdb

  # 关闭中英混合词库：该翻译器只有用户词库，禁用后不再读取 cn_en.txt。
  "cn_en/dictionary": ""
  "cn_en/enable_user_dict": false

  # 注册独立技术词库及动态词频，不替换主拼音翻译器。
  "schema/dependencies/+":
    - tech_codes
  "tech_codes/dictionary": tech_codes
  "tech_codes/user_dict": tech_codes
  "tech_codes/db_class": userdb
  "tech_codes/enable_user_dict": true
  "tech_codes/enable_completion": true
  # 保留前缀补全，只隐藏候选旁的剩余编码提示。
  "tech_codes/comment_format":
    - xform/.*//
  "tech_codes/enable_sentence": false
  "tech_codes/enable_encoder": false
  "tech_codes/initial_quality": 1.4
  "engine/translators/@after 1": table_translator@tech_codes

  # 复用模糊音规则数据，仅追加到原有拼写规则。
  "speller/algebra/+":
    __include: fuzzy:/algebra

  # 在官方过滤器之前处理原始候选，避免操作简繁、Emoji、去重包装。
  "engine/filters/@before 0": lua_filter@*fucking_gh_select

  # 仅将 tech_codes 中已启用且完整匹配输入的英文置顶（忽略大小写）。
  "engine/filters/+":
    - lua_filter@*english_exact_first
