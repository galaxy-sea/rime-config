patch:
  "switches/+":
    - name: programmer_english
      reset: 0

  "engine/processors/@before 0": lua_processor@*programmer_english*processor

  "engine/segmentors/@before 0": lua_segmentor@*programmer_english*segmentor

  "engine/translators/@before 0": lua_translator@*programmer_english*translator

  "engine/filters/+":
    - lua_filter@*programmer_english*filter
  # 模糊音
  "speller/algebra/+":
    # 平翘舌：z/zh、c/ch、s/sh
    - derive/^([zcs])h/$1/
    - derive/^([zcs])([^h])/$1h$2/

    # an ↔ ang
    - derive/an$/ang/
    - derive/ang$/an/

    # en ↔ eng
    - derive/en$/eng/
    - derive/eng$/en/

    # in ↔ ing
    - derive/in$/ing/
    - derive/ing$/in/

    # ian ↔ iang
    - derive/ian$/iang/
    - derive/iang$/ian/

    # uan ↔ uang
    - derive/uan$/uang/
    - derive/uang$/uan/

    # ong → on
    - derive/ong$/on/