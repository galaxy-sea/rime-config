# iOS 雾凇拼音个性化补丁，所有组件列表只追加，不替换官方列表。
patch:
  # 候选权重。
  "translator/initial_quality": 1.2
  "melt_eng/initial_quality": 1.1

  # 关闭中英混合词库：该翻译器只有用户词库，禁用后不再读取 cn_en.txt。
  "cn_en/dictionary": ""
  "cn_en/enable_user_dict": false

  # 注册独立技术词库及动态词频，不替换主拼音翻译器。
  "schema/dependencies/+":
    - tech_codes
  "tech_codes/dictionary": tech_codes
  "tech_codes/user_dict": tech_codes
  "tech_codes/db_class": userdb
  "tech_codes/enable_user_dict": true
  "tech_codes/enable_completion": true
  # 保留前缀补全，只隐藏候选旁的剩余编码提示。
  "tech_codes/comment_format":
    - xform/.*//
  "tech_codes/enable_sentence": false
  "tech_codes/enable_encoder": false
  "tech_codes/initial_quality": 1.4
  "engine/translators/@after 1": table_translator@tech_codes

  # 复用模糊音规则数据，仅追加到原有拼写规则。
  "speller/algebra/+":
    __include: fuzzy:/algebra

  # 独立英文模式，由皮肤「中 / En」按钮切换；reset: 0 表示初始化时关闭。
  # 此开关与原生 ascii_mode 的协调逻辑由 programmer_english.lua 处理。
  "switches/+":
    - name: programmer_english
      reset: 0

  # 优先处理英文模式下的字母输入，保留大小写，并处理 Escape 清空等操作。
  # @before 0：插入现有列表首项之前；*模块*成员：加载 Lua 模块中的对应组件。
  "engine/processors/@before 0": lua_processor@*programmer_english*processor

  # /+：追加到原有列表。初始化时设置 security_terminal_ready，供皮肤显示就绪状态。
  # 该处理器不拦截按键；皮肤中的加密文字仅为装饰，不代表实际加密。
  "engine/processors/+":
    - lua_processor@*security_terminal

  # 英文模式下，将纯字母输入划分成独立片段，交给英文翻译器。
  "engine/segmentors/@before 0": lua_segmentor@*programmer_english*segmentor

  # 生成保留原始大小写的输入候选，并尝试从 melt_eng 词库提供英文补全。
  "engine/translators/@before 0": lua_translator@*programmer_english*translator

  # 英文模式的专属片段只保留该英文翻译器的候选；其他情况放行。
  # 仅追加英文模式过滤器，保留官方过滤器。
  "engine/filters/+":
    - lua_filter@*programmer_english*filter

  # 在简繁、Emoji、去重等包装之前调整原始单字候选范围。
  # 仅前插此过滤器，保留全部官方过滤器；不改写输入或技术词库编码。
  "engine/filters/@before 0": lua_filter@*fucking_gh_select
