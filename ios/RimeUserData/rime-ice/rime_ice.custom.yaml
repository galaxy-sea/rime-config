# iOS 雾凇拼音个性化补丁，在官方方案基础上追加配置。
patch:
  # 引用 macOS / iOS 共用配置：技术词库、候选权重、模糊音等。
  __include: rime_ice_common:/patch

  # 独立英文模式，由皮肤「中 / En」按钮切换；reset: 0 表示初始化时关闭。
  # 此开关与原生 ascii_mode 的协调逻辑由 programmer_english.lua 处理。
  "switches/+":
    - name: programmer_english
      reset: 0

  # 优先处理英文模式下的字母输入，保留大小写，并处理 Escape 清空等操作。
  # @before 0：插入现有列表首项之前；*模块*成员：加载 Lua 模块中的对应组件。
  "engine/processors/@before 0": lua_processor@*programmer_english*processor

  # /+：追加到原有列表。初始化时设置 security_terminal_ready，供皮肤显示就绪状态。
  # 该处理器不拦截按键；皮肤中的加密文字仅为装饰，不代表实际加密。
  "engine/processors/+":
    - lua_processor@*security_terminal

  # 英文模式下，将纯字母输入划分成独立片段，交给英文翻译器。
  "engine/segmentors/@before 0": lua_segmentor@*programmer_english*segmentor

  # 生成保留原始大小写的输入候选，并尝试从 melt_eng 词库提供英文补全。
  "engine/translators/@before 0": lua_translator@*programmer_english*translator

  # 英文模式的专属片段只保留该英文翻译器的候选；其他情况放行。
  # 公共补丁也有 engine/filters/+，修改时应核对部署后的实际过滤器列表。
  "engine/filters/+":
    - lua_filter@*programmer_english*filter
